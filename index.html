<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>申论答题纸 · 每行25格</title>

    <!-- PWA：全部相对路径，兼容 GitHub Pages 子路径部署 -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#eef1f5" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />

    <!-- CSS 解析前先定主题，避免深色用户刷新时白屏闪烁 -->
    <script>
      try {
        var __t = JSON.parse(localStorage.getItem('shenlun.prefs.v1') || '{}').theme
        if (__t !== 'light' && __t !== 'dark') {
          __t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = __t
      } catch (e) {}
    </script>

    <!-- 顺序即级联优先级，responsive.css 必须最后 -->
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/sidebar.css" />
    <link rel="stylesheet" href="css/toolbar.css" />
    <link rel="stylesheet" href="css/paper.css" />
    <link rel="stylesheet" href="css/overlays.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <aside class="sidebar" id="sidebar">
      <div class="sb-head">
        <div class="sb-logo">申论<span>答题纸</span></div>
        <div class="sb-head-spacer"></div>
        <button class="btn tiny" id="themeBtn" type="button" title="切换深色 / 浅色">🌙</button>
        <button class="btn tiny primary" id="newBtn" type="button">＋ 新建</button>
      </div>

      <div class="sb-tools">
        <input
          class="sb-search"
          id="searchInput"
          type="text"
          placeholder="搜索名称或内容…"
          autocomplete="off"
        />
        <div class="sb-sort">
          <span class="sb-sort-label">排序</span>
          <select class="sb-select" id="sortSelect">
            <option value="time-desc">最近修改优先</option>
            <option value="time-asc">最早修改优先</option>
            <option value="name-asc">名称 A → Z</option>
            <option value="name-desc">名称 Z → A</option>
            <option value="created-desc">最近创建优先</option>
          </select>
        </div>
      </div>

      <div class="paper-list" id="paperList"></div>

      <div class="sb-warn" id="storageWarn" style="display: none"></div>

      <div class="sb-foot">
        <button class="btn tiny" id="exportBtn" type="button">导出备份</button>
        <button class="btn tiny" id="importBtn" type="button">导入</button>
        <input type="file" id="importFile" accept=".json,application/json" hidden />
      </div>
    </aside>

    <div class="backdrop" id="backdrop"></div>

    <div class="main">
      <div class="toolbar">
        <button class="btn tiny menu-btn" id="menuBtn" type="button" title="打开答题记录">☰</button>
        <label>行数：<input type="number" id="rowsInput" min="1" max="200" value="40" /></label>
        <div class="divider"></div>
        <input
          type="text"
          id="nameInput"
          placeholder="答题纸名称…"
          autocomplete="off"
          title="为当前答题纸命名"
        />
        <button class="btn" id="saveBtn" type="button" title="Ctrl + S">保存</button>
        <button
          class="btn"
          id="copyBtn"
          type="button"
          title="复制全文，之后可直接 Ctrl + V 粘贴"
        >
          ⧉ 复制
        </button>
        <div class="divider"></div>
        <button class="btn" id="undoBtn" type="button" title="Ctrl + Z">↶ 撤销</button>
        <button class="btn" id="redoBtn" type="button" title="Ctrl + Shift + Z / Ctrl + Y">
          ↷ 重做
        </button>
        <button class="btn" id="clearBtn" type="button">清空全部</button>
        <span class="hint">点击格子定位光标，输入即插入，后文整体后移</span>
        <span class="stat" id="stat">0 / 1000 字</span>
      </div>

      <div class="paper">
        <h1 class="paper-title" id="paperTitle">申论答题纸</h1>
        <!-- 隐藏的输入宿主：格子语义（光标/选区/退格/IME/粘贴）全部交给
             textarea 原生处理，#grid 只负责按 25 字折行铺字 -->
        <textarea
          id="hiddenInput"
          class="hidden-input"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          aria-label="答题纸输入区"
        ></textarea>
        <div id="grid"></div>
      </div>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>
    <div id="modal"></div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
